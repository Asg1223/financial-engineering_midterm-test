<!-- ===================================================== -->
<!-- 第2章 利息計算（拡張版） -->
<!-- ===================================================== -->

<section>

<h2>第2章 利息計算（ローン返済シミュレーション）</h2>

<p>
以下の3種類の返済方式を比較できます。
</p>

<ul>
<li>元利均等返済</li>
<li>元金均等返済</li>
<li>一括返済</li>
</ul>

<div class="formula">
\( A = P(1+r)^n \)
</div>

<label>借入金額（円）</label>
<input type="number"
id="loanAmount"
value="3000000">

<label>年利率（%）</label>
<input type="number"
id="interestRate"
step="0.01"
value="2.0">

<label>返済年数</label>
<input type="number"
id="loanYears"
value="35">

<button onclick="calculateLoans()">
返済計算
</button>

<div class="result"
id="loanResult">
ここに結果が表示されます
</div>

<canvas id="loanChart"
height="120"></canvas>

</section>

<script>

let loanChart = null;

function calculateLoans(){

    let P =
        parseFloat(
            document.getElementById("loanAmount").value
        );

    let annualRate =
        parseFloat(
            document.getElementById("interestRate").value
        ) / 100;

    let years =
        parseFloat(
            document.getElementById("loanYears").value
        );

    let months =
        years * 12;

    let r =
        annualRate / 12;

    // =========================================
    // 元利均等
    // =========================================

    let annuityMonthly =

        P *
        r *
        Math.pow(1+r, months)

        /

        (
            Math.pow(1+r, months) - 1
        );

    let annuityTotal =
        annuityMonthly * months;

    // =========================================
    // 元金均等
    // =========================================

    let principalPart =
        P / months;

    let remaining = P;

    let equalPrincipalTotal = 0;

    for(let i=0;i<months;i++){

        let payment =
            principalPart +
            remaining * r;

        equalPrincipalTotal += payment;

        remaining -= principalPart;

    }

    // =========================================
    // 一括返済
    // =========================================

    let lumpSum =
        P * Math.pow(1+annualRate, years);

    // =========================================
    // 表示
    // =========================================

    document.getElementById("loanResult").innerHTML =

        "<h3>返済結果</h3>"

        +

        "<b>元利均等返済：</b><br>"
        +
        "毎月返済額："
        +
        annuityMonthly.toFixed(0)
        +
        " 円<br>"
        +
        "総返済額："
        +
        annuityTotal.toFixed(0)
        +
        " 円"

        +

        "<br><br>"

        +

        "<b>元金均等返済：</b><br>"
        +
        "総返済額："
        +
        equalPrincipalTotal.toFixed(0)
        +
        " 円"

        +

        "<br><br>"

        +

        "<b>一括返済：</b><br>"
        +
        "総返済額："
        +
        lumpSum.toFixed(0)
        +
        " 円";

    // =========================================
    // グラフ
    // =========================================

    const ctx =
        document.getElementById("loanChart");

    if(loanChart){

        loanChart.destroy();

    }

    loanChart =
        new Chart(ctx, {

            type: 'bar',

            data: {

                labels: [

                    '元利均等',
                    '元金均等',
                    '一括返済'

                ],

                datasets: [{

                    label: '総返済額',

                    data: [

                        annuityTotal,
                        equalPrincipalTotal,
                        lumpSum

                    ]

                }]

            },

            options: {

                responsive:true,

                plugins:{
                    legend:{
                        display:true
                    }
                }

            }

        });

}

</script>

<!-- ===================================================== -->
<!-- CSV → 自動グラフ化 -->
<!-- ===================================================== -->

<section>

<h2>CSVデータ分析（株価分析）</h2>

<p>
CSVファイルを読み込むと、
自動でグラフ化します。
</p>

<input type="file"
id="stockCSV"
accept=".csv">

<button onclick="analyzeStockCSV()">
CSV解析
</button>

<div class="result"
id="stockResult">
ここに結果が表示されます
</div>

<canvas id="stockChart"
height="120"></canvas>

</section>

<script>

let stockChart = null;

function analyzeStockCSV(){

    let file =
        document.getElementById("stockCSV").files[0];

    if(!file){

        alert("CSVを選択してください");
        return;

    }

    let reader =
        new FileReader();

    reader.onload =
        function(e){

            let text =
                e.target.result;

            let rows =
                text.split("\n");

            let prices = [];

            rows.forEach(row=>{

                let num =
                    parseFloat(row);

                if(!isNaN(num)){

                    prices.push(num);

                }

            });

            // リターン計算

            let returns = [];

            for(let i=1;i<prices.length;i++){

                let r =
                    (
                        prices[i]
                        -
                        prices[i-1]
                    )
                    /
                    prices[i-1];

                returns.push(r);

            }

            // 平均

            let mean =
                returns.reduce((a,b)=>a+b,0)
                /
                returns.length;

            // 分散

            let variance =
                returns.reduce(

                    (sum,x)=>

                    sum +
                    Math.pow(x-mean,2),

                    0

                )
                /
                returns.length;

            // 標準偏差

            let sigma =
                Math.sqrt(variance);

            document.getElementById("stockResult").innerHTML =

                "<b>平均収益率：</b> "
                +
                mean.toFixed(6)

                +

                "<br><br>"

                +

                "<b>リスク（標準偏差）：</b> "
                +
                sigma.toFixed(6);

            // グラフ

            const ctx =
                document.getElementById("stockChart");

            if(stockChart){

                stockChart.destroy();

            }

            stockChart =
                new Chart(ctx, {

                    type:'line',

                    data:{

                        labels:
                            prices.map((_,i)=>i+1),

                        datasets:[{

                            label:'株価',

                            data:prices,

                            tension:0.2

                        }]

                    },

                    options:{
                        responsive:true
                    }

                });

        };

    reader.readAsText(file);

}

</script>

<!-- ===================================================== -->
<!-- Efficient Frontier -->
<!-- ===================================================== -->

<section>

<h2>Efficient Frontier</h2>

<p>
効率的フロンティアを描画します。
</p>

<button onclick="drawEfficientFrontier()">
描画
</button>

<canvas id="frontierChart"
height="120"></canvas>

</section>

<script>

let frontierChart = null;

function drawEfficientFrontier(){

    let risks = [];
    let returns = [];

    for(let a=0;a<=1;a+=0.01){

        // 仮データ

        let muX = 0.12;
        let muY = 0.05;

        let sigmaX = 0.20;
        let sigmaY = 0.10;

        let rho = 0.3;

        let mu =
            a*muX + (1-a)*muY;

        let variance =

            (a*a*sigmaX*sigmaX)

            +

            ((1-a)*(1-a)*sigmaY*sigmaY)

            +

            (
                2 *
                a *
                (1-a) *
                rho *
                sigmaX *
                sigmaY
            );

        let sigma =
            Math.sqrt(variance);

        risks.push(sigma);
        returns.push(mu);

    }

    const ctx =
        document.getElementById("frontierChart");

    if(frontierChart){

        frontierChart.destroy();

    }

    frontierChart =
        new Chart(ctx, {

            type:'scatter',

            data:{

                datasets:[{

                    label:'Efficient Frontier',

                    data:
                        risks.map(

                            (r,i)=>({

                                x:r,
                                y:returns[i]

                            })

                        ),

                    showLine:true

                }]

            },

            options:{

                responsive:true,

                scales:{

                    x:{
                        title:{
                            display:true,
                            text:'Risk'
                        }
                    },

                    y:{
                        title:{
                            display:true,
                            text:'Return'
                        }
                    }

                }

            }

        });

}

</script>
